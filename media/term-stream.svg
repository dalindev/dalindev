<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" role="img" aria-label="dalin@parker-ai agent-loop.log: a replay of the agent team log">
  <defs>
    <clipPath id="streamWindow">
      <rect x="0" y="46" width="800" height="128"/>
    </clipPath>
  </defs>

  <!-- Window background -->
  <rect width="800" height="180" rx="10" fill="#0d1117" stroke="#30363d"/>

  <!-- Title bar -->
  <path d="M 0,10 A 10,10 0 0 1 10,0 L 790,0 A 10,10 0 0 1 800,10 L 800,36 L 0,36 Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="800" y2="36" stroke="#30363d"/>

  <!-- Traffic lights -->
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>

  <!-- Title -->
  <text x="400" y="22" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11" fill="#6e7681" letter-spacing="1">dalin@parker-ai — agent-loop.log</text>

  <!-- STREAMING indicator -->
  <g transform="translate(700, 22)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1">
    <circle cx="-12" cy="-4" r="4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="0" fill="#4ade80">STREAMING</text>
  </g>

  <!-- Streaming log group (clipped, scrolling discrete) -->
  <g clip-path="url(#streamWindow)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="12" fill="#c9d1d9">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,-18; 0,-36; 0,-54; 0,-72; 0,-90"
        keyTimes="0; 0.167; 0.333; 0.5; 0.667; 0.833"
        calcMode="discrete"
        dur="9s" repeatCount="indefinite"/>

      <text x="24" y="60"><tspan fill="#4b5563">[18:54:21]</tspan> <tspan fill="#79c0ff">chief.of.staff</tspan> <tspan fill="#4ade80">ok</tspan> · ticket claimed · confidence high · → eng</text>
      <text x="24" y="78"><tspan fill="#4b5563">[18:54:22]</tspan> <tspan fill="#79c0ff">eng.bot</tspan> <tspan fill="#fbbf24">DRAFT</tspan> · draft PR · +142 −38 · 6 files</text>
      <text x="24" y="96"><tspan fill="#4b5563">[18:54:23]</tspan> <tspan fill="#79c0ff">qa.bot</tspan> <tspan fill="#4ade80">ok</tspan> · verified on replica + preview</text>
      <text x="24" y="114"><tspan fill="#4b5563">[18:54:24]</tspan> <tspan fill="#79c0ff">security.agent</tspan> · 2 findings → address or explain</text>
      <text x="24" y="132"><tspan fill="#4b5563">[18:54:25]</tspan> <tspan fill="#79c0ff">eng.manager</tspan> <tspan fill="#4ade80">ok</tspan> · deploy watched · smoke ✓ · verified</text>
      <text x="24" y="150"><tspan fill="#4b5563">[18:54:26]</tspan> <tspan fill="#f59e0b">[gate] prod migration · waiting on a human</tspan></text>
      <text x="24" y="168"><tspan fill="#4b5563">[18:54:27]</tspan> <tspan fill="#79c0ff">status.island</tspan> <tspan fill="#4ade80">ok</tspan> · 30/30 systems healthy</text>
      <text x="24" y="186"><tspan fill="#4b5563">[18:54:28]</tspan> <tspan fill="#79c0ff">claude.code</tspan> <tspan fill="#fbbf24">LOCAL</tspan> · verify-first brief → draft PR</text>
      <text x="24" y="204"><tspan fill="#4b5563">[18:54:29]</tspan> <tspan fill="#79c0ff">cost.scout</tspan> · spend traced to one call site</text>
      <text x="24" y="222"><tspan fill="#4b5563">[18:54:30]</tspan> <tspan fill="#79c0ff">train.loop</tspan> <tspan fill="#fbbf24">EXP</tspan> · exp-042 · eval ≈ frontier · cost ↓ 200×</text>
      <text x="24" y="240"><tspan fill="#4b5563">[18:54:31]</tspan> <tspan fill="#79c0ff">eval.bench</tspan> · 50+ models + variants · tools + MCP</text>
      <text x="24" y="258"><tspan fill="#4b5563">[18:54:32]</tspan> <tspan fill="#79c0ff">heal.workflow</tspan> <tspan fill="#4ade80">ok</tspan> · 1,284 records repaired</text>
    </g>
  </g>
</svg>
